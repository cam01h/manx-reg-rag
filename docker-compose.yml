services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SEND_TO_LOGFIRE=${SEND_TO_LOGFIRE:-false}
      - LOGFIRE_TOKEN=${LOGFIRE_TOKEN}
    volumes:
      - ./data/processed/:/app/data/processed
      - ./logs:/app/logs
    depends_on:
      - qdrant

volumes:
  qdrant_data:
