services:
  qdrant:
    image: qdrant/qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SEND_TO_LOGFIRE=${SEND_TO_LOGFIRE:-true}
      - LOGFIRE_TOKEN=${LOGFIRE_TOKEN}
    volumes:
      - ./data/processed/:/app/data/processed
      - ./logs:/app/logs
    depends_on:
      - qdrant
