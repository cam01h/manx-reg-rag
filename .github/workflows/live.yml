name: Live source check

# Checks that every source document url still works and that the pdf behind it
# has not changed (tests marked `live`). Weekly, and on demand from the Actions tab.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # -m on the command line replaces the `not live` in pyproject.toml's addopts
      - name: Live tests
        run: uv run pytest -m live
