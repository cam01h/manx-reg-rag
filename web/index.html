<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>manx-reg-rag</title>
    <link rel="stylesheet" href="/style.css?v=6">
</head>
<body>

    <header>
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">§</span>
            <div class="brand-text">
                <h1>manx-reg-rag</h1>
                <p class="brand-tag">Research Financial Services legislation, regulation and guidance</p>
            </div>
        </div>
        <div class="header-actions">
            <details id="sector-picker">
                <summary id="sector-summary">Sectors: all</summary>
                <div class="sector-panel">
                    <p class="sector-hint">Tick the sectors you work in. Leave empty to search everything.</p>
                    <div id="sector-options"></div>
                    <button type="button" id="sector-clear">Clear</button>
                </div>
            </details>
            <button type="button" id="toggle-citations">Hide citations</button>
        </div>
    </header>

    <main>
        <div id="left-panel">
            <div id="response"></div>
            <form id="prompt-form">
                <textarea id="prompt-input" rows="1" placeholder="Ask a question..."></textarea>
                <button type="submit">Send</button>
                <button type="button" id="reset-button">Reset</button>
            </form>
        </div>

        <div id="right-panel">
            <h2>Citations</h2>
            <div id="citations"></div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/app.js?v=10"></script>
</body>
</html>
